[project]
name = "fractol"
version = "0.1.0"
description = "Fractol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pillow>=12.3.0", "numpy>=2.0", "pygame>=2.5"]


[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.13",
]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.ruff.format]
quote-style = "double"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_scheme = "semver"
update_changelog_on_bump = true
